name: Verify bundled UnityOrbisBridge

on:
  push:
    paths:
      - "source/Assets/Plugins/PS4/UnityOrbisBridge.prx"
      - "source/Assets/Plugins/UnityOrbisBridge.dll"
      - "source/Assets/Plugins/UnityOrbisBridge.sha256"
      - ".github/workflows/verify-uob.yml"
  pull_request:
    paths:
      - "source/Assets/Plugins/PS4/UnityOrbisBridge.prx"
      - "source/Assets/Plugins/UnityOrbisBridge.dll"
      - "source/Assets/Plugins/UnityOrbisBridge.sha256"
      - ".github/workflows/verify-uob.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify reviewed bridge artifacts
        run: sha256sum --check source/Assets/Plugins/UnityOrbisBridge.sha256
